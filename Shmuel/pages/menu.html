<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDZASO - Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/menu.css">
</head>

<body data-page="menu" class="bg-gray-50">

    <div class="flex min-h-screen">

        <!-- SIDEBAR -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
            <!-- Logo -->
            <div class="p-6 border-b border-gray-200 flex items-center gap-3">
                <div class="w-10 h-10 bg-gray-700 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-orange-500" fill="currentColor" viewBox="0 0 20 20">
                        <path
                            d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z" />
                    </svg>
                </div>
                <span class="text-xl font-bold text-gray-800">CRUDZASO</span>
            </div>

            <!-- Menu Items -->
            <nav class="flex-1 p-4">
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    <span class="font-medium">Mis Tareas</span>
                </a>
                <!-- <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <span class="font-medium">Profile</span>
                </a> -->
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1">

            <!-- TOP BAR -->
            <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between">
                <div class="flex items-center gap-2 text-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span class="text-gray-400">›</span>
                    <span class="font-medium">Mis Tareas</span>
                </div>

                <div class="flex items-center gap-4">
                    <!-- <button class="text-gray-600 hover:text-gray-800">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                    </button> -->
                    <div class="flex items-center gap-3">
                        <img src="https://ui-avatars.com/api/?name=Alex+Morgan&background=3b82f6&color=fff"
                            alt="Alex Morgan" class="w-10 h-10 rounded-full">
                        <div>
                            <div id="nameUserHeader" class="font-semibold text-gray-800">Alex Morgan</div>
                            <!-- <div class="text-xs text-gray-500">Product Designer</div> -->
                        </div>
                        <!-- <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg> -->
                    </div>
                    <button id="btnCerrarSesion" class="text-red-500 hover:text-red-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- CONTENT AREA -->
            <div class="p-8">

                <!-- Page Header -->
                <div class="flex items-start justify-between mb-8">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900 mb-2">Task Manager</h1>
                        <p class="text-gray-600">Overview of your current academic performance tasks.</p>
                    </div>
                    <!-- <button onclick="openModal()" -->
                    <button id="openModal"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold flex items-center gap-2 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        New Task
                    </button>
                </div>
                
                <!-- Task Table -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200">

                    <!-- Search and Filters -->
                    <div class="p-6 border-b border-gray-200">
                        <div class="flex items-center justify-between">
                            <div class="relative flex-1 max-w-md">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                                <input type="text" placeholder="Search tasks..."
                                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    id="searchInput">
                            </div>
                            <!-- <div class="flex gap-2">
                                <button onclick="filterByStatus('all')"
                                    class="filter-btn active px-4 py-2 rounded-lg font-medium">All Tasks</button>
                                <button onclick="filterByStatus('pending')"
                                    class="filter-btn px-4 py-2 rounded-lg font-medium">Pending</button>
                                <button onclick="filterByStatus('completed')"
                                    class="filter-btn px-4 py-2 rounded-lg font-medium">Completed</button>
                            </div> -->
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-blue-50">
                                <tr>
                                    <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">TASK NAME</th>
                                    <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">ASSIGNEE</th>
                                    <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">STATUS</th>
                                    <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">PRIORITY</th>
                                    <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">DUE DATE</th>
                                    <th class="px-6 py-4 text-left text-sm font-semibold text-gray-700">ACTIONS</th>
                                </tr>
                            </thead>
                            <tbody id="taskTableBody">
                                <!-- Tasks will be rendered here by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- NEW TASK MODAL -->
    <div id="taskModal" class="modal">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-gray-900">New Task</h2>
                <!-- <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"> -->
                <button id="closeModal" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- <form onsubmit="addTask(event)" id="taskForm"> -->
            <form id="taskForm">
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Task Name</label>
                    <input type="text" id="nombreTarea" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter task name">
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Assignee</label>
                    <input type="text" id="asignarTarea" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter assignee name">
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Priority</label>
                    <select id="prioridadTarea"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2">Due Date</label>
                    <input type="date" id="fechaTarea" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="flex gap-3">
                    <button type="button" onclick="closeModal()"
                        class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 font-semibold">
                        Cancel
                    </button>
                    <button type="submit"
                        class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold">
                        Add Task
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="../js/main.js"></script>
</body>

</html>
