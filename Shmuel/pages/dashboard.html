<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDZASO - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Asegúrate de que la ruta al CSS sea correcta -->
    <link rel="stylesheet" href="../css/menu.css">
</head>

<body data-page="dashboard" class="bg-gray-50">

    <div class="flex min-h-screen">

        <!-- SIDEBAR -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col fixed h-full">
            <div class="p-6 border-b border-gray-200 flex items-center gap-3">
                <div class="w-10 h-10 bg-gray-800 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-orange-500" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z" />
                    </svg>
                </div>
                <span class="text-xl font-bold text-gray-800 tracking-tight">ADMIN</span>
            </div>

            <nav class="flex-1 p-4">
                <div class="px-4 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Principal</div>
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-700 rounded-lg mb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                    <span class="font-medium">Dashboard</span>
                </a>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 ml-64">

            <!-- TOP BAR -->
            <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between sticky top-0 z-10">
                <div class="flex items-center gap-2 text-gray-500">
                    <span class="font-medium">Administración</span>
                    <span class="text-gray-300">/</span>
                    <span class="text-gray-900 font-semibold">Panel de Control</span>
                </div>

                <div class="flex items-center gap-6">
                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <div id="nameUserHeader" class="font-bold text-gray-900 leading-none">Admin User</div>
                            <span class="text-xs text-blue-600 font-medium uppercase">Administrador</span>
                        </div>
                        <img src="https://ui-avatars.com" class="w-10 h-10 rounded-full border-2 border-white shadow-sm">
                    </div>
                    <button id="btnCerrarSesion" class="p-2 text-gray-400 hover:text-red-500 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </button>
                </div>
            </header>

            <div class="p-8">
                <!-- METRIC CARDS (Sección de estadísticas) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                        <p class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-1">Total Tareas</p>
                        <h3 id="totalTareas" class="text-3xl font-bold text-gray-900">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm border-l-4 border-l-orange-500">
                        <p class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-1">Pendientes</p>
                        <h3 id="tareasPendientes" class="text-3xl font-bold text-gray-900">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm border-l-4 border-l-green-500">
                        <p class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-1 text-gray-500">Completadas</p>
                        <h3 id="tareasCompletadas" class="text-3xl font-bold text-gray-900">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm bg-blue-600 text-white">
                        <p class="text-sm font-medium text-blue-100 uppercase tracking-wider mb-1">Rendimiento</p>
                        <h3 id="metricasGenerales" class="text-3xl font-bold text-gray-900">0%</h3>
                    </div>
                </div>

                <!-- TABLE SECTION -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <!-- Search and Actions -->
                    <div class="p-6 border-b border-gray-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="relative flex-1 max-w-md">
                            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            <input type="text" id="searchInput" placeholder="Buscar por tarea o responsable..." 
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                        </div>
                        <button id="openModal" class="bg-gray-900 hover:bg-black text-white px-6 py-2.5 rounded-xl font-semibold transition-all flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                            Nueva Tarea
                        </button>
                    </div>

                    <!-- Wrapper para scroll horizontal en móviles -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider">Nombre Tarea</th>
                                    <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider">Asignado</th>
                                    <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider">Estado</th>
                                    <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider">Prioridad</th>
                                    <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider">Vencimiento</th>
                                    <th class="px-6 py-4 text-xs font-bold text-gray-500 uppercase tracking-wider text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tbody" class="divide-y divide-gray-100">
                                <!-- JS inyecta las filas aquí -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Asegúrate de cargar tu script principal -->
    <script type="module" src="../js/main.js"></script>
</body>
</html>
